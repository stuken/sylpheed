# C++ catch funclets that end in `bl 0x825F3568` (rethrow, noreturn). Analysis doesn't
# know the call never returns, so these ran on through the trailing EH data words into
# the next funclet and emitted gotos to labels owned by that funclet (clang:
# "use of undeclared label"). Bound each one at its rethrow.
