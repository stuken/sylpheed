# bctr at 0x82657C04: index is bounded by `cmplwi cr6,r9,0xE` at 0x82657B78, so the
# u16 table at 0x820313E0 has 15 entries. Auto-detection reads 24 and runs into the
# next table at 0x82031400, producing bogus targets in sub_82658678 and beyond.
[[switch_tables]]
address = 0x82657C04
register = 9
labels = [
    0x82657C48, 0x82657C50, 0x82657C58, 0x82657C60, 0x82657C68,
    0x82657C70, 0x82657C78, 0x82657C80, 0x82657C88, 0x82657C90,
    0x82657C98, 0x82657CA4, 0x82657CAC, 0x82657CB4, 0x82657CBC,
]

# XAPI fibers. The guest's own SwitchToFiber swaps r1 and returns through the
# saved LR, which recompiled code can't do, so route all five to the SDK's
# host-fiber implementations (src/kernel/crt/threading.cpp). The guest fiber
# block layout matches X_FIBER_CONTEXT (0xA50 bytes).
[rexcrt]
ConvertThreadToFiber = 0x824AB048
ConvertFiberToThread = 0x824AB0D8
CreateFiber = 0x824AB128
DeleteFiber = 0x824AB208
SwitchToFiber = 0x824AB268
